# ---- Contraseñas en tu compu: se leen del archivo secretos.properties (al lado del pom.xml).
# Ese archivo NO se sube a GitHub (esta en .gitignore). En Render se usan variables de entorno.
spring.config.import=optional:file:./secretos.properties,optional:file:./trucoclub/secretos.properties,optional:file:./trucoclub-v2/trucoclub/secretos.properties

# ---- Base de datos: Supabase (PostgreSQL)
# Se usa el "Session pooler" de Supabase (puerto 5432): funciona desde redes IPv4 como Render.
# Los datos salen de variables de entorno, asi la contrasena nunca queda en el codigo:
#   SUPABASE_DB_URL       -> en Supabase: Connect > Session pooler > JDBC (solo la parte jdbc:postgresql://...:5432/postgres)
#   SUPABASE_DB_USER      -> postgres.wnywcpoplqzsdanywgdg
#   SUPABASE_DB_PASSWORD  -> lospibesdetudai2023.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres.wnywcpoplqzsdanywgdg}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Las tablas estan en el esquema "trucoclub" (no en "public", que Supabase publica en su API)
spring.jpa.properties.hibernate.default_schema=trucoclub
# Pocas conexiones: el plan gratis de Supabase tiene un limite chico de clientes en el pooler
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Si falta alguna columna nueva, Spring la agrega sola (las tablas ya estan creadas en Supabase)
spring.jpa.hibernate.ddl-auto=update

# Para ver las consultas SQL en la consola de IntelliJ
spring.jpa.show-sql=true

# ---- Supabase Auth: el login y el registro los hace Supabase. El backend solo verifica el token
# que manda el front. La URL del proyecto se usa para bajar las claves publicas (JWKS) y validar el emisor.
trucoclub.supabase.url=${SUPABASE_URL:https://wnywcpoplqzsdanywgdg.supabase.co}
# Solo si tu proyecto firma los tokens con la clave "legacy" HS256: Project Settings > JWT Keys > Legacy JWT secret.
# Si usa claves nuevas (ES256/RS256) dejalo vacio.
trucoclub.supabase.jwt-secret=${SUPABASE_JWT_SECRET:}

# Para volver a usar tu MySQL local: arranca con el perfil "mysql" (ver application-mysql.properties)

# Para que el front reciba el mensaje de error (ej: "La mesa ya está completa")
server.error.include-message=always

# Clave para firmar los tokens de sesion. En produccion (Render) defini la variable de entorno JWT_SECRET
# con una clave larga y secreta (minimo 32 caracteres). Si la cambias, todos tienen que volver a iniciar sesion.
trucoclub.jwt.secret=${JWT_SECRET:clave-de-desarrollo-trucoclub-cambiala-en-produccion}
# Dias que dura la sesion antes de tener que volver a entrar
trucoclub.jwt.dias=7

# ---- Admins: usuarios (ya registrados) que pasan a ser ADMIN al arrancar. Separados por coma.
# Ponelo con tu usuario, por ejemplo: trucoclub.admins=${ADMINS:joaco}
trucoclub.admins=${ADMINS:trucoforever}

# ---- Depósitos y retiros
# Cuenta a la que los jugadores transfieren para depositar (se muestra en la pantalla de depositar).
# CAMBIALOS por los datos reales de tu cuenta.
trucoclub.pagos.alias=${PAGOS_ALIAS:alias.de.prueba}
trucoclub.pagos.cbu=${PAGOS_CBU:12345678910}
trucoclub.pagos.titular=${PAGOS_TITULAR:estoy probando}
# Montos en pesos
trucoclub.pagos.minimo-deposito=500
trucoclub.pagos.minimo-retiro=1000
trucoclub.pagos.maximo=1000000

# Cuantos retiros puede pedir cada jugador por dia (cuentan los pendientes y aprobados)
trucoclub.pagos.retiros-por-dia=2
