# Conexion a la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/trucoclub_db?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=truco123

# Esto le dice a Spring que cree las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Para ver las consultas SQL en la consola de IntelliJ
spring.jpa.show-sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Para que el front reciba el mensaje de error (ej: "La mesa ya está completa")
server.error.include-message=always

# Clave para firmar los tokens de sesion. En produccion (Render) defini la variable de entorno JWT_SECRET
# con una clave larga y secreta (minimo 32 caracteres). Si la cambias, todos tienen que volver a iniciar sesion.
trucoclub.jwt.secret=${JWT_SECRET:clave-de-desarrollo-trucoclub-cambiala-en-produccion}
# Dias que dura la sesion antes de tener que volver a entrar
trucoclub.jwt.dias=7

# ---- Admins: usuarios (ya registrados) que pasan a ser ADMIN al arrancar. Separados por coma.
# Ponelo con tu usuario, por ejemplo: trucoclub.admins=${ADMINS:joaco}
trucoclub.admins=${ADMINS:trucoforever}

# ---- Depósitos y retiros
# Cuenta a la que los jugadores transfieren para depositar (se muestra en la pantalla de depositar).
# CAMBIALOS por los datos reales de tu cuenta.
trucoclub.pagos.alias=${PAGOS_ALIAS:alias.de.prueba}
trucoclub.pagos.cbu=${PAGOS_CBU:12345678910}
trucoclub.pagos.titular=${PAGOS_TITULAR:estoy probando}
# Montos en pesos
trucoclub.pagos.minimo-deposito=500
trucoclub.pagos.minimo-retiro=1000
trucoclub.pagos.maximo=1000000

# Cuantos retiros puede pedir cada jugador por dia (cuentan los pendientes y aprobados)
trucoclub.pagos.retiros-por-dia=2
